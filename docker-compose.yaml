networks:
  mysql-pma-network:
    driver: bridge


services:
  #depends on zorgt dat de webservice wacht tot dat een connectie is met de db
  web:
    image: php:8.2-apache
    ports:
      - "80:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: test_db

    #./ de hele project map naar de /var/www
    volumes:
      - ./:/var/www
    networks:
      - mysql-pma-network

    # om de apache naar de public te laten kijken && de regel 25 voor .htacces
    command: >
      bash -c " docker-php-ext-install pdo pdo_mysql &&
      sed -i 's#/var/www/html#/var/www/public#' /etc/apache2/sites-available/000-default.conf &&
      sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf &&
      a2enmod rewrite &&
      apache2-foreground"
    depends_on:
      - db




  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password

    networks:
      - mysql-pma-network

    volumes:
      - dbdata:/var/lib/mysql


  pma:
    depends_on:
      - db
    #    build: ./
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    networks:
      - mysql-pma-network



volumes:
  # om data opteslaan ook als de container gestopt of verwijderd
  dbdata: